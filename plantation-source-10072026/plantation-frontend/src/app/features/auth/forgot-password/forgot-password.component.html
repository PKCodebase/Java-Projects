<div class="auth-wrap">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>🔑 Reset your password</mat-card-title>
      <mat-card-subtitle>We'll email you a one-time code</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-stepper linear #stepper>
        <!-- Step 1: email -->
        <mat-step [stepControl]="emailForm" label="Email">
          <form [formGroup]="emailForm" (ngSubmit)="sendOtp()" class="step-form">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Account email</mat-label>
              <input matInput type="email" formControlName="email" />
              <mat-error>Enter a valid email</mat-error>
            </mat-form-field>
            <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
              <mat-spinner *ngIf="loading()" diameter="20" class="btn-spin"></mat-spinner>
              <span *ngIf="!loading()">Send OTP</span>
            </button>
          </form>
        </mat-step>

        <!-- Step 2: OTP + new password -->
        <mat-step [stepControl]="otpForm" label="OTP & new password">
          <form [formGroup]="otpForm" (ngSubmit)="reset()" class="step-form">
            <p class="hint">Enter the code sent to <b>{{ emailSentTo() }}</b></p>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>OTP</mat-label>
              <input matInput formControlName="otp" maxlength="6" />
              <mat-error>Enter the 4–6 digit code</mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>New password</mat-label>
              <input matInput type="password" formControlName="newPassword" />
              <mat-error>Min 8 characters</mat-error>
            </mat-form-field>
            <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
              <mat-spinner *ngIf="loading()" diameter="20" class="btn-spin"></mat-spinner>
              <span *ngIf="!loading()">Reset password</span>
            </button>
          </form>
        </mat-step>
      </mat-stepper>
    </mat-card-content>
    <mat-card-actions class="auth-actions">
      <a mat-button routerLink="/login">Back to sign in</a>
    </mat-card-actions>
  </mat-card>
</div>
