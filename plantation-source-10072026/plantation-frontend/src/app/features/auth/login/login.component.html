<div class="auth-wrap">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>🌿 Green Plantation Portal</mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-tab-group mat-stretch-tabs="true">
        <!-- ── Citizen ── -->
        <mat-tab label="Citizen">
          <form [formGroup]="form" (ngSubmit)="submit('citizen')" class="auth-form">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email" autocomplete="email" />
              <mat-error *ngIf="form.controls.email.hasError('required')">Email is required</mat-error>
              <mat-error *ngIf="form.controls.email.hasError('email')">Enter a valid email</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Password</mat-label>
              <input matInput [type]="hide() ? 'password' : 'text'"
                     formControlName="password" autocomplete="current-password" />
              <button mat-icon-button matSuffix type="button" (click)="hide.set(!hide())">
                <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
              <mat-error>Password is required</mat-error>
            </mat-form-field>

            <div class="links">
              <a routerLink="/forgot-password">Forgot password?</a>
              <a routerLink="/otp-login">Login with OTP</a>
            </div>

            <button mat-flat-button color="primary" class="full-width btn-lg"
                    type="submit" [disabled]="loading()">
              <mat-spinner *ngIf="loading()" diameter="20" class="btn-spin"></mat-spinner>
              <span *ngIf="!loading()">Sign In</span>
            </button>
          </form>
        </mat-tab>

        <!-- ── Official / Staff ── -->
        <mat-tab label="Official">
          <form [formGroup]="form" (ngSubmit)="submit('official')" class="auth-form">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Official Email</mat-label>
              <input matInput type="email" formControlName="email" autocomplete="email" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Password</mat-label>
              <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password" />
              <button mat-icon-button matSuffix type="button" (click)="hide.set(!hide())">
                <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </mat-form-field>

            <button mat-flat-button color="primary" class="full-width btn-lg"
                    type="submit" [disabled]="loading()">
              <mat-spinner *ngIf="loading()" diameter="20" class="btn-spin"></mat-spinner>
              <span *ngIf="!loading()">Sign In</span>
            </button>
          </form>
        </mat-tab>
      </mat-tab-group>

      <!-- ── Google sign-in ── -->
      <div class="oauth">
        <mat-divider></mat-divider>

        <!-- Not configured: says so, instead of navigating to a dead URL -->
        <button *ngIf="!googleEnabled" mat-stroked-button class="full-width btn-lg" type="button"
                (click)="oauthLogin()">
          Continue with Google
        </button>
        <p *ngIf="!googleEnabled" class="oauth-note">
          Google sign-in is not configured on this deployment.
        </p>

        <!-- Configured: the official Google Identity Services button -->
        <div #googleButton class="g-signin" [class.hidden]="!googleEnabled"></div>
      </div>
    </mat-card-content>

    <mat-card-actions class="auth-actions">
      <span>New here?</span>
      <a mat-button color="primary" routerLink="/register">Create an account</a>
    </mat-card-actions>
  </mat-card>
</div>
