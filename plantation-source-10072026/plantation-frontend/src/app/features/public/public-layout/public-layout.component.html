<mat-toolbar color="primary" class="topbar">
  <a routerLink="/home" class="brand">🌿 Plantation Portal</a>

  <span class="toolbar-spacer"></span>

  <nav class="nav-links">
    <a mat-button routerLink="/home" routerLinkActive="active">Home</a>
    <a mat-button routerLink="/parks" routerLinkActive="active">Parks</a>
    <a mat-button routerLink="/trees" routerLinkActive="active">Tree Species</a>
    <a mat-button routerLink="/verify" routerLinkActive="active">Verify Certificate</a>
  </nav>

  <ng-container *ngIf="auth.isAuthenticated; else anon">
    <button mat-button [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
      <span class="hide-sm">{{ (auth.user$ | async)?.fullName || 'Account' }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item routerLink="/citizen/bookings">
        <mat-icon>event</mat-icon> My bookings
      </button>
      <button mat-menu-item (click)="auth.logout()">
        <mat-icon>logout</mat-icon> Sign out
      </button>
    </mat-menu>
  </ng-container>
  <ng-template #anon>
    <a mat-stroked-button routerLink="/login">Sign in</a>
  </ng-template>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>

<footer class="footer">
  <p>🌿 Municipal Corporation of Delhi — Horticulture Department · Green Plantation Portal</p>
</footer>
