<div class="page">
  <h1 class="page-title">Citizens</h1>
  <p class="page-sub">Registered citizens on the portal</p>

  <mat-card>
    <table mat-table [dataSource]="citizens()" class="full-width">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let r">{{ r.fullName }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let r">{{ r.email }}</td>
      </ng-container>
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let r">{{ r.phone || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="registered">
        <th mat-header-cell *matHeaderCellDef>Registered</th>
        <td mat-cell *matCellDef="let r">{{ r.registeredAt | date:'mediumDate' }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-pill" [class.on]="r.isActive">{{ r.isActive ? 'Active' : 'Inactive' }}</span>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="cols"></tr>
      <tr mat-row *matRowDef="let row; columns: cols;"></tr>
    </table>
    <p *ngIf="!loading() && citizens().length === 0" class="muted">No citizens found.</p>
  </mat-card>
</div>
