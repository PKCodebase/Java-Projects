<div class="page">
  <h1 class="page-title">Zones</h1>
  <p class="page-sub">Administrative zones covered by the drive</p>

  <mat-card>
    <table mat-table [dataSource]="zones()" class="full-width">
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let r">{{ r.code }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let r">{{ r.name }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-pill" [class.on]="r.isActive">{{ r.isActive ? 'Active' : 'Inactive' }}</span>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="cols"></tr>
      <tr mat-row *matRowDef="let row; columns: cols;"></tr>
    </table>
    <p *ngIf="!loading() && zones().length === 0" class="muted">No zones found.</p>
  </mat-card>
</div>
