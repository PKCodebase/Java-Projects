<h2 mat-dialog-title>{{ isEdit ? 'Edit park' : 'New park' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label><input matInput formControlName="name" />
      <mat-error>Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Zone</mat-label>
      <mat-select formControlName="zoneId">
        <mat-option *ngFor="let z of data.zones" [value]="z.zoneId">{{ z.name }}</mat-option>
      </mat-select>
      <mat-error>Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Address</mat-label><input matInput formControlName="address" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>City</mat-label><input matInput formControlName="city" />
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Latitude</mat-label><input matInput type="number" formControlName="latitude" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Longitude</mat-label><input matInput type="number" formControlName="longitude" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label><textarea matInput rows="2" formControlName="description"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="saving()">
    {{ saving() ? 'Saving…' : 'Save' }}
  </button>
</mat-dialog-actions>
