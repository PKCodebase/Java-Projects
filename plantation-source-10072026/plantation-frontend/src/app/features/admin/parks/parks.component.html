<div class="page">
  <div class="head">
    <div>
      <h1 class="page-title">Parks</h1>
      <p class="page-sub">Create and manage plantation parks</p>
    </div>
    <button mat-flat-button color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon> New park
    </button>
  </div>

  <mat-form-field appearance="outline" class="filter">
    <mat-label>Zone</mat-label>
    <mat-select [(ngModel)]="zoneFilter" (selectionChange)="pageIndex = 0; load()">
      <mat-option value="">All</mat-option>
      <mat-option *ngFor="let z of zones()" [value]="z.zoneId">{{ z.name }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-card>
    <table mat-table [dataSource]="parks()" class="full-width">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let r">{{ r.name }}</td>
      </ng-container>
      <ng-container matColumnDef="zone">
        <th mat-header-cell *matHeaderCellDef>Zone</th>
        <td mat-cell *matCellDef="let r">{{ r.zone?.name || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="city">
        <th mat-header-cell *matHeaderCellDef>City</th>
        <td mat-cell *matCellDef="let r">{{ r.city || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="slots">
        <th mat-header-cell *matHeaderCellDef>Slots (free/total)</th>
        <td mat-cell *matCellDef="let r">{{ r.freeSlots ?? 0 }} / {{ r.totalSlots ?? 0 }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-pill" [class.on]="r.isActive">{{ r.isActive ? 'Active' : 'Inactive' }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button (click)="openDialog(r)" title="Edit"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button (click)="deactivate(r)" title="Deactivate"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayed"></tr>
      <tr mat-row *matRowDef="let row; columns: displayed;"></tr>
    </table>
    <p *ngIf="!loading() && parks().length === 0" class="muted pad">No parks found.</p>
  </mat-card>

  <mat-paginator [length]="total()" [pageSize]="pageSize" [pageIndex]="pageIndex"
                 (page)="onPage($event)" showFirstLastButtons></mat-paginator>
</div>
