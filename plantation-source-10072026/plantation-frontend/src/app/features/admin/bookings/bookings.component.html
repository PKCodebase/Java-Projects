<div class="page">
  <h1 class="page-title">Bookings</h1>
  <p class="page-sub">All plantation bookings</p>

  <mat-card>
    <table mat-table [dataSource]="bookings()" class="full-width">
      <ng-container matColumnDef="ref">
        <th mat-header-cell *matHeaderCellDef>Reference</th>
        <td mat-cell *matCellDef="let r"><b>{{ r.bookingRef }}</b></td>
      </ng-container>
      <ng-container matColumnDef="citizen">
        <th mat-header-cell *matHeaderCellDef>Citizen</th>
        <td mat-cell *matCellDef="let r">{{ r.citizenName || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="park">
        <th mat-header-cell *matHeaderCellDef>Park</th>
        <td mat-cell *matCellDef="let r">{{ r.parkName || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let r">{{ r.slotDate || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r"><span class="pill">{{ r.status }}</span></td>
      </ng-container>
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let r">{{ r.amountPaid != null ? '₹' + r.amountPaid : '—' }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="cols"></tr>
      <tr mat-row *matRowDef="let row; columns: cols;"></tr>
    </table>
    <p *ngIf="!loading() && bookings().length === 0" class="muted">No bookings found.</p>
  </mat-card>
</div>
