<mat-sidenav-container class="shell">
  <mat-sidenav #snav [mode]="isHandset() ? 'over' : 'side'" [opened]="!isHandset()" class="sidenav">
    <div class="brand">
      <mat-icon>eco</mat-icon>
      <span *ngIf="!isHandset()">MCD Admin</span>
    </div>
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of nav" [routerLink]="item.path"
         routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>
    <div class="sidenav-foot">
      <a mat-list-item routerLink="/home">
        <mat-icon matListItemIcon>public</mat-icon>
        <span matListItemTitle>Public site</span>
      </a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button *ngIf="isHandset()" (click)="snav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-spacer"></span>
      <button mat-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
        <span class="hide-sm">Admin</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="auth.logout()"><mat-icon>logout</mat-icon> Sign out</button>
      </mat-menu>
    </mat-toolbar>

    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
