<div class="page">
  <div class="head">
    <div>
      <h1 class="page-title">Occasions</h1>
      <p class="page-sub">Occasions citizens can book trees for</p>
    </div>
    <button mat-flat-button color="primary" (click)="openNew()"><mat-icon>add</mat-icon> New occasion</button>
  </div>

  <mat-card *ngIf="showForm()" class="form-card">
    <mat-card-content>
      <form [formGroup]="form" class="form">
        <div class="row">
          <mat-form-field appearance="outline"><mat-label>Name</mat-label>
            <input matInput formControlName="name" /><mat-error>Required</mat-error></mat-form-field>
          <mat-form-field appearance="outline"><mat-label>Emoji</mat-label>
            <input matInput formControlName="emojiCode" /><mat-error>Required</mat-error></mat-form-field>
          <mat-form-field appearance="outline"><mat-label>Display order</mat-label>
            <input matInput type="number" formControlName="displayOrder" /></mat-form-field>
        </div>
        <mat-form-field appearance="outline"><mat-label>Description</mat-label>
          <textarea matInput rows="2" formControlName="description"></textarea></mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button (click)="close()">Cancel</button>
      <button mat-flat-button color="primary" (click)="save()">Save</button>
    </mat-card-actions>
  </mat-card>

  <mat-card class="mt-16">
    <table mat-table [dataSource]="occasions()" class="full-width">
      <ng-container matColumnDef="emoji">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r"><span class="emoji">{{ r.emojiCode }}</span></td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let r">{{ r.name }}<div class="muted2">{{ r.description }}</div></td>
      </ng-container>
      <ng-container matColumnDef="order">
        <th mat-header-cell *matHeaderCellDef>Order</th>
        <td mat-cell *matCellDef="let r">{{ r.displayOrder }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-pill" [class.on]="r.isActive">{{ r.isActive ? 'Active' : 'Inactive' }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r"><button mat-icon-button (click)="openEdit(r)"><mat-icon>edit</mat-icon></button></td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="cols"></tr>
      <tr mat-row *matRowDef="let row; columns: cols;"></tr>
    </table>
    <p *ngIf="!loading() && occasions().length === 0" class="muted">No occasions.</p>
  </mat-card>
</div>
