<div class="page">
  <h1 class="page-title">Assignments</h1>
  <p class="page-sub">Assign officials to parks</p>

  <mat-card class="assign-box">
    <div class="assign-row">
      <mat-form-field appearance="outline">
        <mat-label>Park</mat-label>
        <mat-select [(ngModel)]="selectedPark">
          <mat-option *ngFor="let p of parks()" [value]="p.parkId">{{ p.name }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Official</mat-label>
        <mat-select [(ngModel)]="selectedOfficial">
          <mat-option *ngFor="let o of officials()" [value]="o.officialId">
            {{ o.name }} ({{ o.employeeId }})
          </mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="assign()"
              [disabled]="!selectedPark || !selectedOfficial">Assign</button>
    </div>
  </mat-card>

  <mat-card class="mt-16">
    <table mat-table [dataSource]="assignments()" class="full-width">
      <ng-container matColumnDef="park">
        <th mat-header-cell *matHeaderCellDef>Park</th>
        <td mat-cell *matCellDef="let r">{{ r.parkName }}</td>
      </ng-container>
      <ng-container matColumnDef="official">
        <th mat-header-cell *matHeaderCellDef>Official</th>
        <td mat-cell *matCellDef="let r">{{ r.officialName }} · {{ r.officialEmployeeId }}</td>
      </ng-container>
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let r">{{ r.officialRole }}</td>
      </ng-container>
      <ng-container matColumnDef="assignedAt">
        <th mat-header-cell *matHeaderCellDef>Assigned</th>
        <td mat-cell *matCellDef="let r">{{ r.assignedAt | date:'short' }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button (click)="unassign(r)" title="Remove"><mat-icon>person_remove</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="cols"></tr>
      <tr mat-row *matRowDef="let row; columns: cols;"></tr>
    </table>
    <p *ngIf="!loading() && assignments().length === 0" class="muted">No assignments yet.</p>
  </mat-card>
</div>
