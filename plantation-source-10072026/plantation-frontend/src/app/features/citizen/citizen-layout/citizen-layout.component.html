<mat-sidenav-container class="shell">
  <mat-sidenav #snav [mode]="isHandset() ? 'over' : 'side'" [opened]="!isHandset()" class="sidenav">
    <div class="brand"><mat-icon>person</mat-icon><span *ngIf="!isHandset()">My Portal</span></div>
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of nav" [routerLink]="item.path" routerLinkActive="active">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button *ngIf="isHandset()" (click)="snav.toggle()"><mat-icon>menu</mat-icon></button>
      <span class="toolbar-spacer"></span>
      <button mat-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
        <span class="hide-sm">{{ (auth.user$ | async)?.fullName || 'Account' }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="auth.logout()"><mat-icon>logout</mat-icon> Sign out</button>
      </mat-menu>
    </mat-toolbar>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
