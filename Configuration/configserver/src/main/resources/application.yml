
spring:
  application:
    name: configserver
  profiles:
    active: native

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  management:
    endpoints:
      web:
        exposure:
          include: "*"

  # datasource:
  #   url: jdbc:mysql://localhost:3306/configdb
  #   username: ${USERNAME}
  #   password: ${PASSWORD}
  #   driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

server:
  port: 9090

# Encryption configuration
encrypt:
  key-store:
    location: classpath:config-server.jks
    password: mypass
    alias: config-server-key


